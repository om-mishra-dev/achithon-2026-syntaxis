[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-vulnerability-auditor"
version = "0.1.0"
description = "Automated Multi-Agent Codebase Vulnerability and Dependency Graph Auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Syntaxis Security Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console"
]
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "networkx>=3.0",
    "rich>=13.0.0",
    "typer>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
parsers = [
    "tree-sitter>=0.20.0"
]

[project.scripts]
auditor = "auditor.cli_legacy:main"
phantom = "auditor.phantom_cli:main"

[tool.setuptools.packages.find]
include = ["auditor*"]

